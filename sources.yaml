# ---------------------------------------------------------------------------
# NOT polled by the bot. Kept here so nobody re-checks them or adds them by
# mistake. "email alerts" means: covered by the employer's own job-alert emails,
# which the version-two email adapter will read. "not checked" means the
# careers system has not been identified yet.
#
# These are the employers from my Nov 2026 job search that actually had
# student roles in range, plus the ones I asked about.
#
# Company              System                        Covered by
# Amazon               amazon.jobs (own)             email alerts if offered; terms restrict robots
# Apple                jobs.apple.com (own)          manual check; terms prohibit scraping
# Google               own careers site              email alerts
# Microsoft            Eightfold                     email alerts
# Nvidia               Workday                       email alerts
# Intel                Workday                       email alerts
# MKS (Ophir)          Workday (mksinst.wd1)         email alerts
# HP (Indigo)          Workday (hp.wd5)              email alerts
# SAP                  own job site, not checked     email alerts if offered
# Marvell              not checked                   email alerts if offered
# Qualcomm             not checked                   email alerts if offered
# Samsung Israel R&D   not checked                   manual check
# PTC                  not identified                manual check
# Elbit                own site                      manual check
# IAI                  own site, not checked         manual check
# Rafael               own site                      manual check
# Check Point          own site                      manual check
# KPMG Israel          custom site                   manual check
# Amdocs               own portal                    manual check
# Earnix               no Greenhouse/Lever board     manual check
# Upwind               no Greenhouse/Lever/Ashby board  manual check
# Copyscape, UVision   not checked                   manual check
